{% extends 'base.html' %}{% block content %}<section class="page-head"><div><p class="eyebrow">PREFERENCES</p><h1>Settings</h1><p>Make your study space feel calm and personal.</p></div></section><section class="panel settings"><h2>Profile & appearance</h2><form method="post">{% csrf_token %}{{ form.as_p }}
<label>University<input name="university" value="{{ profile.university }}" placeholder="e.g. Chattogram Veterinary and Animal Sciences University"></label>
<label>Department<input name="department" value="{{ profile.department }}" placeholder="e.g. Food Science and Technology"></label>
<div class="two-col"><label>Batch<input name="batch" value="{{ profile.batch }}" placeholder="e.g. 17"></label><label>Student ID / Roll<input name="student_id" value="{{ profile.student_id }}" placeholder="Your ID"></label></div>
<label>Year<input name="year" type="number" min="1" max="10" value="{{ profile.year|default:'' }}"></label><label>Theme<select name="theme"><option value="light" {% if pref.theme == 'light' %}selected{% endif %}>Sage Garden</option><option value="dark" {% if pref.theme == 'dark' %}selected{% endif %}>Deep Garden</option></select></label><p class="muted">Member since {{ request.user.date_joined|date:'F Y' }}</p><div class="actions"><a href="{% url 'export_data' %}">Export my data</a><button class="primary">Save settings</button></div></form></section>{% endblock %}
